spring.application.name=microstamp-cast-step4
server.port=8108

#DB
spring.datasource.url=jdbc:mysql://localhost:3306/cast_step4?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&useTimezone=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456

#JPA
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update

#Security
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8001

#Eureka
eureka.client.serviceUrl.defaultZone=http://localhost:8002/eureka/
eureka.instance.prefer-ip-address=true

#Cors
cors.whitelist=http://127.0.0.1:8000,http://127.0.0.1:3000,http://localhost:8000,http://localhost:3000
