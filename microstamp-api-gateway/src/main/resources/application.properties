spring.application.name=microstamp-api-gateway
server.port=8000

management.endpoints.web.exposure.include=*

allowed.origins=http://127.0.0.1:3000,http://localhost:3000

#Eureka
eureka.client.serviceUrl.defaultZone=http://localhost:8002/eureka/
eureka.instance.prefer-ip-address=true


#Cors
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin RETAIN_UNIQUE
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=${allowed.origins}
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true

#MicroSTAMP-Auth-Server
spring.cloud.gateway.routes[0].id=MICROSTAMP-AUTH-SERVER
spring.cloud.gateway.routes[0].uri=lb://MICROSTAMP-AUTH-SERVER
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**
spring.cloud.gateway.routes[0].filters[0]=RewritePath=/auth(?<segment>/?.*), $\{segment}

#MicroSTAMP-Step1
spring.cloud.gateway.routes[1].id=MICROSTAMP-STEP1
spring.cloud.gateway.routes[1].uri=lb://MICROSTAMP-STEP1
spring.cloud.gateway.routes[1].predicates[0]=Path=/step1/**
spring.cloud.gateway.routes[1].filters[0]=RewritePath=/step1(?<segment>/?.*), $\{segment}

#MicroSTAMP-Step2
spring.cloud.gateway.routes[2].id=MICROSTAMP-STEP2
spring.cloud.gateway.routes[2].uri=lb://MICROSTAMP-STEP2
spring.cloud.gateway.routes[2].predicates[0]=Path=/step2/**
spring.cloud.gateway.routes[2].filters[0]=RewritePath=/step2(?<segment>/?.*), $\{segment}

#MicroSTAMP-Step3
spring.cloud.gateway.routes[3].id=MICROSTAMP-STEP3
spring.cloud.gateway.routes[3].uri=lb://MICROSTAMP-STEP3
spring.cloud.gateway.routes[3].predicates[0]=Path=/step3/**
spring.cloud.gateway.routes[3].filters[0]=RewritePath=/step3(?<segment>/?.*), $\{segment}

#MicroSTAMP-Step4
spring.cloud.gateway.routes[4].id=MICROSTAMP-STEP4
spring.cloud.gateway.routes[4].uri=lb://MICROSTAMP-STEP4
spring.cloud.gateway.routes[4].predicates[0]=Path=/step4/**
spring.cloud.gateway.routes[4].filters[0]=RewritePath=/step4(?<segment>/?.*), $\{segment}

#MicroSTAMP-Step4-New
spring.cloud.gateway.routes[5].id=MICROSTAMP-STEP4-NEW
spring.cloud.gateway.routes[5].uri=lb://MICROSTAMP-STEP4-NEW
spring.cloud.gateway.routes[5].predicates[0]=Path=/step4new/**
spring.cloud.gateway.routes[5].filters[0]=RewritePath=/step4new(?<segment>/?.*), $\{segment}

#MicroSTAMP-CAST-Step1 (\
spring.cloud.gateway.routes[6].id=MICROSTAMP-CAST-STEP1
spring.cloud.gateway.routes[6].uri=lb://MICROSTAMP-CAST-STEP1
spring.cloud.gateway.routes[6].predicates[0]=Path=/cast-step1/**
spring.cloud.gateway.routes[6].filters[0]=RewritePath=/cast-step1(?<segment>/?.*), $\{segment}

#MicroSTAMP-CAST-Step3
spring.cloud.gateway.routes[7].id=MICROSTAMP-CAST-STEP3
spring.cloud.gateway.routes[7].uri=lb://MICROSTAMP-CAST-STEP3
spring.cloud.gateway.routes[7].predicates[0]=Path=/cast-step3/**
